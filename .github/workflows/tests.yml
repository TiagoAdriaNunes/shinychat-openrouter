name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testthat:
    name: Run testthat
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Same system libraries as the Dockerfile
      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libwebp-dev \
            libuv1-dev \
            libssl-dev \
            libxml2-dev \
            libsodium-dev \
            zlib1g-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      # Tests mock all OpenRouter calls, so no API key is needed
      - name: Run tests
        run: Rscript tests/testthat.R
