app = "add-app-name-for-your-app"
primary_region = "gru"

[build]

[env]
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # R needs ~7 s (renv, modules, World Bank data prewarm) before it listens on 8080: give it time
  # before Fly judges the port, then check the page answers
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
