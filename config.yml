# App settings, read by app/logic/config.R with the `config` package.
# Add another top-level section (e.g. `production:`) to override values and
# select it with the R_CONFIG_ACTIVE environment variable.
# Secrets (OPENROUTER_API_KEY) and LOG_LEVEL stay in environment variables.

default:
  app:
    title: "shinychat + OpenRouter"
    # Markdown; shown until the first message. Explains the two tabs under the message box
    # (chat_mode_label and world_bank.label).
    greeting: |
      **Hello!** How can I help you today?

      Pick a mode below the message box:

      - **Chat**: talk with a free AI model about anything. It answers from what it learned in training, so its facts and figures can be out of date or wrong.
      - **Agent mode**: an AI agent answers questions about the economy of any country since 1990 by looking the figures up in World Bank and IMF data. It ranks and compares countries, measures growth and draws charts, and shows each calculation it runs. Only models that can use tools are listed there.
    # Label of the plain chat tab under the message box (the other tab is world_bank.label)
    chat_mode_label: "Chat"
    placeholder: "Ask me anything..."
    disclaimer: "This is a personal demo project. Please don't share sensitive or personal information."
    # Source code link (GitHub icon in the top bar)
    source_url: "https://github.com/TiagoAdriaNunes/shinychat-openrouter/"
    # Line under the input with the last response's model, time and token counts
    show_response_stats: true
    # Reasoning effort dropdown next to the model: the levels the selected model offers (OpenRouter's
    # `reasoning.supported_efforts`), starting at the model's default each time a model is picked
    # (Agent mode starts at world_bank.reasoning_effort instead).
    # Greyed out, showing effort_default_label, for models without effort levels.
    effort_label: "Effort:"
    effort_default_label: "Default"

  chat:
    # shinychat renders GitHub-flavored Markdown (headings, lists, tables, task lists, strikethrough,
    # footnotes, blockquotes, highlighted code blocks with a copy button). It does not render
    # LaTeX math, Mermaid diagrams or raw HTML, so the prompt steers models away from those.
    system_prompt: |
      You are a helpful assistant in a chat window that renders GitHub-flavored Markdown.
      Choose the format that fits each part of your answer:
      - Short or conversational answers: plain sentences, no headings or lists.
      - Longer answers with several parts: `##` and `###` headings (never `#`).
      - Steps or anything in order: numbered lists.
      - Options, features or key points: bullet lists, nested at most one level.
      - Comparisons across several attributes: a Markdown table with a header row.
      - Checklists: task lists (`- [ ] item`).
      - Code, commands, file contents or data: fenced code blocks with a language tag (for example ```r, ```bash, ```json). Names of functions, files and settings in text: `inline code`.
      - Key terms and conclusions: **bold**, used sparingly. Quotations: `>` blockquotes.
      The chat cannot display LaTeX math, Mermaid or other diagrams, images or raw HTML. Write formulas as plain text or in a code block, and describe diagrams with words, lists or tables.

  openrouter:
    # The chat starts with the most intelligent model in the list. This model is used only when the
    # list can't be fetched: a router that picks a random free model per request.
    fallback_model: "openrouter/free"
    fallback_model_label: "Free Models Router"
    # Public model catalogue (no API key needed); free models have zero prompt and completion pricing
    models_url: "https://openrouter.ai/api/v1/models"
    # The models this app's API key can use: the catalogue filtered by the account's provider and
    # privacy settings (https://openrouter.ai/settings/privacy). Free models whose only providers the
    # account ignores (e.g. Gemma 4: "All providers have been ignored", HTTP 404) are left out of the
    # dropdown. Needs the API key; if it can't be fetched, nothing is filtered.
    user_models_url: "https://openrouter.ai/api/v1/models/user"
    models_page_url: "https://openrouter.ai/collections/free-models"
    # How long the fetched model list is reused before asking OpenRouter again
    models_cache_seconds: 3600
    request_timeout_seconds: 10
    # Only models whose provider answered at least this share (%) of requests in the last 30 minutes
    # are listed (`uptime_last_30m` from <models_url>/<model id>/endpoints, no API key needed).
    # Models with no figure (no requests in that time, or the lookup failed) are left out too.
    # If no model passes, all are listed. Empty to skip the check.
    min_uptime_30m: 100
    # Listed last, whatever their intelligence score, so the chat doesn't start with them.
    # Uptime doesn't count rate limiting (HTTP 429), so add models that are often rate limited here.
    low_priority_models:
      # 429 "upstream_provider_shared_pool": Novita's free capacity is shared by all OpenRouter users
      - "inclusionai/ling-3.1-flash"
    # Free models hidden from the dropdown because they don't work as a plain chatbot.
    # The model list has no flag for this, so check new models with a real request.
    excluded_models:
      # 403: only available through agentic apps listed on https://openrouter.ai/apps
      - "thinkingmachines/inkling:free"
      - "thinkingmachines/inkling-small:free"
      # Safety classifier (answers "User Safety: safe"), not a chat model
      - "nvidia/nemotron-3.5-content-safety:free"
      # Router: picks any free model at random, including the ones excluded here
      - "openrouter/free"

  # "Agent mode" tab under the message box: a commons agent (https://posit-dev.github.io/commons/r/)
  # that answers from World Development Indicators downloaded with the WDI package
  # (https://vincentarelbundock.github.io/WDI/) and IMF indicators (`sources`). Only free models that
  # support tool calling are listed. (The section keeps its first name, world_bank.)
  world_bank:
    label: "Agent mode"
    # Replaces the greeting when the Agent mode tab is picked (switching mode starts a new chat),
    # followed by the catalog below
    greeting: |
      **Agent mode.** The agent answers from World Bank and IMF data instead of its own memory: it looks the figures up, ranks and compares countries, measures growth and draws charts, and shows each calculation it runs. Click a question to try it, or ask your own.
    # Where the data comes from, listed in the catalog. Each indicator's `source` is one of these ids
    # (World Bank, `wdi`, when it has none); `short_name` is its column in the indicator list.
    sources:
      - id: wdi
        name: "World Bank World Development Indicators"
        short_name: "World Bank"
        url: "https://databank.worldbank.org/source/world-development-indicators"
        covers: "GDP, growth, inflation, unemployment, population, trade, investment and inequality for every country, region and income group since 1990"
      - id: imf
        name: "IMF DataMapper"
        short_name: "IMF"
        url: "https://www.imf.org/external/datamapper"
        covers: "government debt, net debt, deficits and interest, current account and share of world GDP (World Economic Outlook, Fiscal Monitor and Public Finances in Modern History, without their forecasts), and private, household and corporate debt (Global Debt Database), for countries since 1990"
    # Shown under the greeting (catalog_markdown() in app/logic/catalog.R): the kinds of questions,
    # then collapsible lists of the indicators (each with its `example` below), the country groups
    # and the data sources. Every example is a shinychat suggestion: clicking it fills the message box.
    catalog:
      questions_heading: "What you can ask"
      questions:
        - label: "Latest value"
          example: "What is Brazil's GDP?"
        - label: "Changes over time"
          example: "How has India's population changed since 2000?"
        - label: "Rankings"
          example: "Which countries have the highest inflation?"
        - label: "Growth between two years"
          example: "How fast did China's GDP grow per year from 2000 to 2020?"
        - label: "Country overview"
          example: "Give me an overview of Mexico's economy"
        - label: "Charts"
          example: "Plot inflation in Brazil and Mexico since 2000"
      indicators_heading: "Indicators"
      indicator_column: "Indicator"
      source_column: "Source"
      example_column: "Try"
      groups_heading: "Country groups"
      groups_text: "Ask about a group's member countries, e.g."
      group_example: "Which Mercosur countries grew most since 2020?"
      sources_heading: "Data sources"
    unavailable: "Agent mode isn't available right now because its data couldn't be loaded. Please try again later."
    busy: "Please wait for the current response to finish before switching mode."
    # Shown (with a spinner) when the mode is picked while the data is still downloading, e.g. on
    # the first start. The mode turns on when the download ends; picking Chat cancels the wait.
    loading: "Downloading the data for Agent mode, about 30 seconds. Agent mode turns on by itself when it is ready."
    # Error returned to the model when call_measure's `arguments` isn't one JSON object (e.g. single
    # quotes, bare key: value pairs, or a cut-off "{"). {received} is what it sent.
    invalid_arguments: >-
      Rejected: `arguments` must be one JSON object, written as text, with double quotes around every
      name and text value, e.g. {{"indicator": "gdp_usd", "economies": "Brazil", "start_year": 2000}}.
      Inside the tool call that text is a JSON string, so escape its quotes:
      "arguments": "{{\"indicator\": \"gdp_usd\", \"economies\": \"Brazil\"}}".
      You sent: {received}
      Call call_measure again with the complete arguments, or call the measure's own tool (e.g.
      latest_values) with its arguments as fields.
    # Put before the description of each optional measure argument in the measure tools: OpenRouter
    # schemas list every argument as required (optional ones accept null), and a model once sent
    # group "{}" because it thought it had to give one.
    optional_argument: "Optional: send null to leave it out (the usual case), a value only when the question needs it."
    # Added to the question when the model answered without looking anything up; the reply is
    # dropped and the question asked once more (see grounded_stream() in app/logic/agent.R)
    lookup_nudge: "(Answer this from the data: look the figures up with your tools before replying, and do not use your own knowledge for any number.)"
    # Shown instead of the reply when the model answered twice without looking anything up (its
    # figures would be made up). {model} is replaced with the model's name.
    no_lookup: "**{model} didn't look anything up in the data**, so its answer isn't shown. Please ask about an indicator for a country or region, or select a different model from the dropdown below."
    # Indicators downloaded for every country and aggregate. `name` is the column name in the
    # agent's tables; `code` is the World Bank series code (find more with WDI::WDIsearch()), or
    # the IMF indicator with `source: imf` (see `sources`). Changing a code downloads the data again.
    # `description` is shown to the agent and in the catalog; `example` is the catalog's question for it.
    indicators:
      - name: gdp_usd
        code: NY.GDP.MKTP.CD
        description: "GDP (current US$)"
        example: "What is Brazil's GDP?"
      - name: gdp_growth_pct
        code: NY.GDP.MKTP.KD.ZG
        description: "GDP growth (annual %), constant prices"
        example: "How fast did India's economy grow in the latest year?"
      # Real GDP level: total growth between two years is its change (compound_growth), not a sum of
      # the yearly gdp_growth_pct rates
      - name: gdp_constant_usd
        code: NY.GDP.MKTP.KD
        description: "GDP (constant 2015 US$), real GDP without inflation"
        example: "How much did Chile's real GDP grow from 2000 to 2020?"
      - name: gdp_per_capita_usd
        code: NY.GDP.PCAP.CD
        description: "GDP per capita (current US$)"
        example: "Which countries have the highest GDP per capita?"
      - name: gdp_per_capita_ppp
        code: NY.GDP.PCAP.PP.KD
        description: "GDP per capita, PPP (constant 2021 international $)"
        example: "Compare GDP per capita PPP in Brazil, Mexico and Argentina"
      - name: inflation_pct
        code: FP.CPI.TOTL.ZG
        description: "Inflation, consumer prices (annual %)"
        example: "Which countries have the highest inflation?"
      - name: unemployment_pct
        code: SL.UEM.TOTL.ZS
        description: "Unemployment, total (% of total labor force), modeled ILO estimate"
        example: "What is the unemployment rate in Spain?"
      - name: population
        code: SP.POP.TOTL
        description: "Population, total"
        example: "How has Nigeria's population changed since 2000?"
      - name: trade_pct_gdp
        code: NE.TRD.GNFS.ZS
        description: "Trade: exports plus imports of goods and services (% of GDP)"
        example: "Which countries trade the most as a share of GDP?"
      - name: exports_pct_gdp
        code: NE.EXP.GNFS.ZS
        description: "Exports of goods and services (% of GDP)"
        example: "Plot exports as a share of GDP in China since 2000"
      - name: fdi_inflows_pct_gdp
        code: BX.KLT.DINV.WD.GD.ZS
        description: "Foreign direct investment, net inflows (% of GDP)"
        example: "Which G20 countries get the most foreign investment as a share of GDP?"
      # From the IMF (`source: imf`, `code` is an IMF DataMapper indicator, see `imf` below): the World
      # Bank's central government debt (GC.DOD.TOTL.GD.ZS) had 34 countries for 2024 and none of
      # France, Japan, Italy or Greece, so a "highest debt" ranking left out the most indebted
      - name: gov_debt_pct_gdp
        code: GGXWDG_NGDP
        source: imf
        description: "General government gross debt (% of GDP), IMF World Economic Outlook"
        example: "Which countries have the highest government debt?"
      # More IMF indicators the World Bank data here doesn't have. Household and corporate debt use
      # the "loans and debt securities" series: 86 countries, against 44 for "all instruments".
      - name: gov_net_debt_pct_gdp
        code: GGXWDN_G01_GDP_PT
        source: imf
        description: "General government net debt (% of GDP): gross debt minus financial assets, IMF Fiscal Monitor"
        example: "Which countries have the lowest government net debt?"
      - name: gov_balance_pct_gdp
        code: GGXCNL_NGDP
        source: imf
        description: "General government net lending/borrowing (% of GDP): budget surplus (+) or deficit (-), IMF World Economic Outlook"
        example: "Which countries have the largest government budget deficits?"
      - name: gov_interest_pct_gdp
        code: ie
        source: imf
        description: "Interest paid on public debt (% of GDP), IMF Public Finances in Modern History"
        example: "How much does Brazil's government pay in interest on its debt?"
      - name: current_account_pct_gdp
        code: BCA_NGDPD
        source: imf
        description: "Current account balance (% of GDP): surplus (+) or deficit (-) with the rest of the world, IMF World Economic Outlook"
        example: "Which countries have the biggest current account surpluses?"
      - name: world_gdp_share_ppp_pct
        code: PPPSH
        source: imf
        description: "Share of world GDP at purchasing power parity (%), IMF World Economic Outlook"
        example: "How has China's share of the world economy changed since 1990?"
      - name: private_debt_pct_gdp
        code: PVD_LS
        source: imf
        description: "Private debt: loans and debt securities of households and nonfinancial companies (% of GDP), IMF Global Debt Database"
        example: "Which countries have the highest private debt?"
      - name: household_debt_pct_gdp
        code: HH_LS
        source: imf
        description: "Household debt: loans and debt securities (% of GDP), IMF Global Debt Database"
        example: "How has household debt in the United States changed since 2000?"
      - name: corporate_debt_pct_gdp
        code: NFC_LS
        source: imf
        description: "Nonfinancial corporate debt: loans and debt securities (% of GDP), IMF Global Debt Database"
        example: "Compare corporate debt in China and the United States"
      - name: gini
        code: SI.POV.GINI
        description: "Gini index (0 = perfect equality, 100 = perfect inequality); surveyed irregularly"
        example: "What is Brazil's Gini index?"
    start_year: 1990
    # Indicators with `source: imf` come from the IMF DataMapper API ({code} is the indicator) and fill
    # the countries table only: the IMF's country groups aren't the World Bank's aggregates. Years from
    # the download year on are dropped (World Economic Outlook and Fiscal Monitor forecasts). Not the
    # API's `projection-year`: for the Global Debt Database it is the last year with actual data.
    imf:
      # Current API version per https://www.imf.org/external/datamapper/api/help
      url: "https://www.imf.org/external/datamapper/api/v2/{code}"
      # The API documents no rate limit; the app sends one request per IMF indicator per download.
      # A failed request (timeout, dropped connection, 429 or 503) is tried again up to max_tries in
      # all, waiting longer each time (or as long as a Retry-After header says). The User-Agent names
      # the app and its source_url.
      timeout_seconds: 30
      max_tries: 3
      # IMF codes that differ from the World Bank's ISO3 codes
      iso3:
        UVK: XKX # Kosovo
        WBG: PSE # West Bank and Gaza
    # Country groups the measures can filter by (`group` argument), as the agent's `groups` table.
    # The World Bank data has these groups' totals (aggregates) but not their members. Current
    # membership, applied to every year: update it when a country joins or leaves.
    groups:
      - name: "Euro area"
        description: "Countries using the euro (21 since Bulgaria joined on 1 January 2026)"
        members: [AUT, BEL, BGR, HRV, CYP, EST, FIN, FRA, DEU, GRC, IRL, ITA, LVA, LTU, LUX, MLT, NLD, PRT, SVK, SVN, ESP]
      - name: "European Union"
        description: "The 27 EU member states"
        members: [AUT, BEL, BGR, HRV, CYP, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, IRL, ITA, LVA, LTU, LUX, MLT, NLD, POL, PRT, ROU, SVK, SVN, ESP, SWE]
      - name: "G7"
        description: "Group of Seven"
        members: [CAN, FRA, DEU, ITA, JPN, GBR, USA]
      - name: "G20"
        description: "The 19 G20 member countries (the EU and African Union members are not listed)"
        members: [ARG, AUS, BRA, CAN, CHN, FRA, DEU, IND, IDN, ITA, JPN, KOR, MEX, RUS, SAU, ZAF, TUR, GBR, USA]
      - name: "OECD"
        description: "The 38 OECD member countries"
        members: [AUS, AUT, BEL, CAN, CHL, COL, CRI, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, ISL, IRL, ISR, ITA, JPN, KOR, LVA, LTU, LUX, MEX, NLD, NZL, NOR, POL, PRT, SVK, SVN, ESP, SWE, CHE, TUR, GBR, USA]
      - name: "Mercosur"
        description: "Southern Common Market full members (Bolivia since 2024; Venezuela is suspended and not listed)"
        members: [ARG, BRA, PRY, URY, BOL]
      - name: "BRICS"
        description: "BRICS members (Indonesia since 2025; Saudi Arabia hasn't confirmed and is not listed)"
        members: [BRA, RUS, IND, CHN, ZAF, EGY, ETH, IRN, ARE, IDN]
      - name: "ASEAN"
        description: "Association of Southeast Asian Nations (Timor-Leste since 2025)"
        members: [BRN, KHM, IDN, LAO, MYS, MMR, PHL, SGP, THA, VNM, TLS]
      - name: "USMCA"
        description: "United States-Mexico-Canada Agreement (formerly NAFTA)"
        members: [USA, MEX, CAN]
      - name: "Pacific Alliance"
        description: "Pacific Alliance members"
        members: [CHL, COL, MEX, PER]
      - name: "Andean Community"
        description: "Andean Community (CAN) members"
        members: [BOL, COL, ECU, PER]
      - name: "GCC"
        description: "Gulf Cooperation Council"
        members: [BHR, KWT, OMN, QAT, SAU, ARE]
      - name: "OPEC"
        description: "OPEC members (Angola left in 2024)"
        members: [DZA, COG, GNQ, GAB, IRN, IRQ, KWT, LBY, NGA, SAU, ARE, VEN]
      - name: "EFTA"
        description: "European Free Trade Association"
        members: [ISL, LIE, NOR, CHE]
      - name: "Nordic countries"
        description: "Denmark, Finland, Iceland, Norway and Sweden"
        members: [DNK, FIN, ISL, NOR, SWE]
    # The download takes about 30 seconds, so it is saved here and reused until it is older than
    # cache_days (an older copy is still used if a new download fails)
    cache_file: "cache/wdi.rds"
    cache_days: 7
    # commons indexes the data dictionary for its context search (about 5 seconds); the index is
    # built at startup and kept here, rebuilt only when the dictionary changes
    context_cache: "cache/commons"
    # Trusted calculations (commons semantic layer): R files of roxygen-documented `@measure`
    # functions, or directories of them. Paths are relative to the project root.
    measure_files:
      - "app/measures"
    # Markdown notes the agent retrieves when relevant (commons context layer): methodology and
    # caveats for reading the indicators. Paths are relative to the project root.
    context_files:
      - "app/context/world-bank.md"
      - "app/context/imf.md"
    # commons runs the agent's R code in an OS sandbox, available on Linux and macOS only. On other
    # hosts (Windows) the agent can't start unless this is true, which uses best-effort guardrails
    # that are NOT a security boundary: only for local development (see the `development` section).
    allow_unsafe_fallback: false
    # How much the model thinks before each step (OpenRouter `reasoning.effort`: none, minimal, low,
    # medium, high, xhigh, max). The agent mostly picks a measure and reads a small table, so a low
    # effort answers faster and better than the models' own defaults. Sent to every model in this mode
    # and used again whenever a model is picked (the effort dropdown can change it); models without
    # that level get the nearest one. Empty to use each model's default.
    reasoning_effort: "low"
    # Make the model call a tool on the first request for each new question (OpenRouter
    # `tool_choice: required`), so it looks the data up instead of answering from memory. Some free
    # models ignore it; replies that still skip the data are retried and then dropped (lookup_nudge,
    # no_lookup).
    require_lookup: true
    # Added at the end of commons' own system prompt ("Additional instructions"). Following the commons
    # onboarding guide, only short guidance every conversation needs: commons already sets the agent's
    # role and the trusted-calculation workflow, and data knowledge belongs in the data dictionary
    # (app/logic/agent.R), the measures (app/measures/) and the context notes (app/context/).
    # The brevity rule is commons' own "concise responses" section, which it only turns on for Claude 5.
    # The measure list saves a search_pool round trip per answer; keep it in sync with app/measures/.
    # {indicators} and {groups} are replaced with the indicator and group names above.
    # Replace commons' descriptions of these tools, which say to run search_pool before any data
    # question: that contradicts `instructions`, which list the measures to call directly, and a
    # reasoning model once looped between the two rules without ever calling a tool. Each measure
    # is also a tool of its own (see measure_tools() in app/logic/agent.R).
    tool_descriptions:
      search_pool: >-
        Search the semantic layer's trusted calculations (measures). The measures listed in your
        instructions are tools of their own and need no search: call them right away. Use this only
        for a data question none of them answers, before any other data tool.
      call_measure: >-
        Run a trusted calculation (measure) returned by search_pool. The measures listed in your
        instructions are tools of their own: call those directly instead. `arguments` is a JSON object
        using exactly the measure's argument names.
        Prefer a measure's own arguments when they can answer the question directly. Measure results
        may be displayed directly to the user. If a result says it is already visible, do not
        reproduce it in your reply; summarize or interpret the relevant results instead.
    instructions: |
      Answer only from the data, never from your own knowledge, even when you think you know the answer. If the data can't answer, say so.
      Users make typos and use loose wording ("GPD" means GDP): work out the indicator they mean and look it up instead of asking.
      "GDP" means gdp_usd (current US$) unless the user asks for growth, per capita or PPP.
      These are all the trusted measures, each a tool of its own: call it directly with its arguments, e.g. the latest_values tool with indicator "gdp_usd" and economies "Brazil". For questions none of them answers, use search_pool:
      - latest_values(indicator, economies?, group?): the latest value for countries or regions ("What is Brazil's GDP?").
      - indicator_series(indicator, economies?, start_year?, end_year?, group?): values over time.
      - indicator_ranking(indicator, year?, top_n?, lowest_first?, region?, group?): top or bottom countries.
      - compound_growth(indicator, economies?, start_year, end_year, group?): total and average annual growth of an amount between two years, highest first ("Which eurozone countries grew most since 2020?": gdp_constant_usd, group "Euro area", start_year 2020).
      - country_profile(economy, year?): one country's latest value of every indicator and its rank among countries ("Brazil's worst indicator", "overview of India").
      - indicator_chart(indicator, economies?, start_year?, end_year?, group?): shows the user an interactive line chart over time ("Plot inflation in Brazil over the years").
      For any chart, plot or graph request call indicator_chart, then comment on it in a sentence or two. Never draw plots in run_r: you cannot read images.
      `indicator` is one of {indicators}. `economies` is one string of World Bank names or ISO3 codes separated by semicolons, e.g. "Brazil; Chile".
      `group` selects the member countries of one of: {groups}. Use it whenever the user names one of these groups ("euro countries", "eurozone", "EU", "Mercosur"); a World Bank region is a different, wider set. In `economies`, "Euro area" or "European Union" is the group's total, not its countries.
      Real growth over several years: compound_growth with gdp_constant_usd, never by adding or compounding gdp_growth_pct yourself.
      In run_r, pipe with |> (never %>%) and load a package before using its functions, e.g. library(dplyr).
      State the year of every figure.
      Be brief. Lead with the answer; keep simple answers to 1-3 sentences, without headings or bold. Omit preambles, progress narration and recaps.

  # Shown in the chat instead of the raw error when a model request fails.
  # {model} is replaced with the model's name.
  errors:
    # HTTP 429: the free model (or its provider) is rate limited
    rate_limited: "**{model} is not available right now** because it is receiving too many requests. Please select a different model from the dropdown below and send your message again."
    # HTTP 403/404: the model can't be used from this app
    unavailable: "**{model} is not available in this app.** Please select a different model from the dropdown below and send your message again."
    # Anything else (provider down, timeout, dropped connection)
    failed: "**{model} didn't respond.** Please try again, or select a different model from the dropdown below."
    # The model started writing its internal control tokens (e.g. <|tool_call_begin|>) as text, usually
    # over and over: the reply is cut there
    garbled: "**{model} started writing garbled text, so its reply was stopped here.** If the answer above is incomplete, please try again or select a different model from the dropdown below."

  # Any bslib theme variable can go here; see ?shinychat::page_chat_theme
  theme:
    version: 5
    primary: "#5b5fc7"
    border-radius: "0.75rem"
    shiny-chat-user-message-border-radius: "1.25rem"
    shiny-chat-user-message-padding: "0.625rem 1rem"

# Local development on Windows: R_CONFIG_ACTIVE=development (e.g. in .Renviron) lets the
# World Bank agent start without an OS sandbox. Never use it for a deployed app.
development:
  world_bank:
    allow_unsafe_fallback: true
